name: Profile images

on:
  pull_request:
  push:
    paths:
      - README.md
      - .github/workflows/profile-images.yml

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify the local profile image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          image_path = 'assets/chatgpt-token-activity.svg'
          assert f']({image_path})' in Path('README.md').read_text(), 'Expected the local activity image in README'
          activity = ET.parse(image_path).getroot()
          assert activity.tag == '{http://www.w3.org/2000/svg}svg'
          print('Local profile SVG and README link verified.')
          PY
