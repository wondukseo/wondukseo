name: Token activity tests

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/token-activity-tests.yml'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test offline collection, privacy, and publication boundaries
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
